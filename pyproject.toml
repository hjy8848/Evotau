[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evotau"
version = "0.1.0"
description = "τ-bench-based alternating Customer and Service self-evolution research framework"
requires-python = ">=3.12,<3.14"
dependencies = ["PyYAML>=6.0,<7", "tiktoken>=0.9,<1"]

[project.optional-dependencies]
tau-bench = [
  "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@b7ea9074c1cba482b30687fecdb5c8425fd6f619",
  # tau2 1.0.1 eagerly imports its voice provider from tau2.__init__ even for
  # text-only runs, but declares websockets only in its optional voice extra.
  "websockets>=13.0",
]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4"]

[project.scripts]
evotau-phase0 = "evotau.phase0:main"
evotau-phase0-run = "evotau.phase0_run:main"
evotau-evolve = "evotau.alternating_run:main"
evotau-service-repair = "evotau.service_repair_run:main"
evotau-web = "evotau.web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
