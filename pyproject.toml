[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evotau"
version = "0.1.0"
description = "Research layer for policy-preserving customer-service co-evolution on tau-bench"
requires-python = ">=3.12,<3.14"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
tau-bench = [
  "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@b7ea9074c1cba482b30687fecdb5c8425fd6f619",
  # tau2 1.0.1 eagerly imports its voice provider from tau2.__init__ even for
  # text-only runs, but declares websockets only in its optional voice extra.
  "websockets>=13.0",
]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4"]

[project.scripts]
evotau-phase0 = "evotau.phase0:main"
evotau-phase0-run = "evotau.phase0_run:main"
evotau-phase3-run = "evotau.phase3_run:main"
evotau-activation-smoke-run = "evotau.activation_smoke_run:main"
evotau-customer-evolver-smoke = "evotau.customer_evolver_smoke:main"
evotau-customer-skill-v3-smoke = "evotau.customer_skill_v3_smoke:main"
evotau-customer-skill-v3-behavior-smoke = "evotau.customer_skill_v3_behavior_smoke:main"
evotau-mechanism-preflight = "evotau.mechanism_preflight:main"
evotau-pilot-preflight = "evotau.pilot_preflight:main"
evotau-pilot-run = "evotau.pilot_run:main"
evotau-task-review-template = "evotau.task_review:main"
evotau-calibrate-attribution = "evotau.calibration:main"
evotau-analyze-rq1 = "evotau.study_analysis:main"
evotau-analyze-rq2 = "evotau.service_analysis:main"
evotau-analyze-rq3 = "evotau.research_analysis:main"
evotau-formal-preflight = "evotau.preregistration:main"
evotau-formal-analyze = "evotau.formal_analysis:main"
evotau-calculate-power = "evotau.power_analysis:main"
evotau-profile-cost = "evotau.cost_analysis:main"
evotau-web = "evotau.web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
